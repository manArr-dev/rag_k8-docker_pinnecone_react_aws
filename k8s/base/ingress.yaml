# Provisions an Application Load Balancer via the AWS Load Balancer Controller.
# All traffic goes to the frontend; its nginx proxies /api to the backend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    # Streamed answers can pause while the model reasons; the default 60 s would cut them off.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
