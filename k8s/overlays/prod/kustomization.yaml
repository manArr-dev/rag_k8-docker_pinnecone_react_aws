apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# The deploy workflow points these at the ECR images for the commit being
# released (`kustomize edit set image`). For a manual deploy, set them yourself.
images:
  - name: rag-backend
    newName: rag-backend
    newTag: latest
  - name: rag-frontend
    newName: rag-frontend
    newTag: latest

