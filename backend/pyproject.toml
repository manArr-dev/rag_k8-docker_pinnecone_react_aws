[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG API: PyTorch embeddings + reranking, Pinecone retrieval, Claude generation"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# FastAPI's Depends()/File() defaults are the framework's intended idiom.
ignore = ["B008"]
